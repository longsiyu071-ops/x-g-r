<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我们的相册</title>
<style>
  :root {
    --bg: #fbf6ee; --card: #fffdf9; --ink: #4a3b30; --soft: #9a8676;
    --line: #eadfce; --accent: #e58a4e; --accent-soft: #fbe6d6; --danger: #c9533f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1a16; --card: #2a231e; --ink: #f1e6da; --soft: #b19f8e;
      --line: #3b322b; --accent: #f0a06a; --accent-soft: #4a3326; --danger: #e77a66;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg);
    padding: calc(14px + env(safe-area-inset-top)) 16px 8px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0 0 2px; font-size: 20px; }
  .sub { color: var(--soft); font-size: 12px; }
  .tabs { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
  .tabs button { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 5px 13px; font-size: 13px; }
  .tabs button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { padding: 12px 16px 100px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
  .grid figure { margin: 0; position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden;
    background: var(--line); cursor: pointer; }
  .grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .grid .pin { position: absolute; top: 4px; left: 6px; font-size: 13px; }
  .empty { text-align: center; color: var(--soft); padding: 60px 0; }
  .fab { position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom));
    width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--accent); color: #fff;
    font-size: 30px; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  dialog { border: 0; border-radius: 16px; background: var(--card); color: var(--ink);
    width: min(92vw, 420px); padding: 18px; }
  dialog::backdrop { background: rgba(30,20,10,.45); }
  label { display: block; font-size: 13px; color: var(--soft); margin: 10px 0 4px; }
  select, textarea, input { width: 100%; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--ink); padding: 8px; font: inherit; }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .row button { border: 0; border-radius: 8px; padding: 8px 16px; font: inherit;
    background: var(--accent-soft); color: var(--ink); }
  .row button.main { background: var(--accent); color: #fff; }
  .row button.del { background: none; color: var(--danger); margin-right: auto; }
  #viewer { width: 100vw; max-width: 100vw; height: 100vh; max-height: 100vh; margin: 0; padding: 0;
    border-radius: 0; background: #000; color: #fff; }
  #viewer .box { display: flex; flex-direction: column; height: 100%; }
  #viewer img { flex: 1; min-height: 0; object-fit: contain; width: 100%; }
  #viewer .info { padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); background: #111; }
  #viewer .meta { font-size: 12px; color: #aaa; }
  #viewer .row button { background: #333; color: #fff; }
  #viewer .row button.del { background: none; color: #ff8a75; }
  .previews { display: flex; gap: 6px; overflow-x: auto; }
  .previews img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; flex: none; }
</style>
</head>
<body>
<header>
  <h1>我们的相册</h1>
  <div class="sub" id="stats">　</div>
  <div class="tabs" id="tabs">
    <button data-kind="" class="on">全部</button>
    <button data-kind="face">卿卿的样子</button>
    <button data-kind="ours">我们的珍藏</button>
    <button data-kind="drawn">栖栖画的</button>
  </div>
</header>
<main><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>还没有照片，点右下角放第一张</div></main>
<button class="fab" id="add" aria-label="放照片">＋</button>
<input type="file" id="picker" accept="image/*" multiple hidden>

<dialog id="uploader">
  <div class="previews" id="previews"></div>
  <label>放进哪里</label>
  <select id="upKind">
    <option value="ours">我们的珍藏</option>
    <option value="face">卿卿的样子</option>
    <option value="drawn">栖栖画的</option>
  </select>
  <label>谁放的</label>
  <select id="upBy"><option value="qingqing">卿卿</option><option value="luyu">栖栖</option></select>
  <label>想说的话</label>
  <textarea id="upCaption" rows="3" placeholder="这张是……"></textarea>
  <div class="row">
    <button id="upCancel">算了</button>
    <button class="main" id="upGo">放进去</button>
  </div>
</dialog>

<dialog id="viewer">
  <div class="box">
    <img id="vImg" alt="">
    <div class="info">
      <div class="meta" id="vMeta"></div>
      <textarea id="vCaption" rows="2" style="background:#222;color:#fff;border-color:#333;margin-top:6px"></textarea>
      <div class="row">
        <button class="del" id="vDel">删掉</button>
        <button id="vPin">置顶</button>
        <button id="vSave">存说明</button>
        <button id="vClose">关</button>
      </div>
    </div>
  </div>
</dialog>

<script>
const KIND_NAME = { face: '卿卿的样子', ours: '我们的珍藏', drawn: '栖栖画的' };
const BY_NAME = { qingqing: '卿卿', luyu: '栖栖' };
const $ = (id) => document.getElementById(id);
let kind = '', photos = [], current = null, pending = [];

function getToken() { try { return localStorage.getItem('albumToken') || ''; } catch { return ''; } }
function setToken(t) { try { localStorage.setItem('albumToken', t); } catch {} }
function withToken(url) { const t = getToken(); return t ? url + (url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(t) : url; }

async function api(url, opts = {}) {
  opts.headers = Object.assign({ 'x-album-token': getToken() }, opts.headers);
  const res = await fetch(url, opts);
  if (res.status === 401) {
    const t = prompt('相册钥匙：');
    if (t) { setToken(t); return api(url, opts); }
    throw new Error('没有钥匙');
  }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || '出错了');
  return data;
}

function fmtDate(iso) { const d = new Date(iso); return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`; }
function fmtBytes(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.round(n / 1024) + ' KB'; }

async function refresh() {
  photos = await api('api/photos' + (kind ? '?kind=' + kind : ''));
  const grid = $('grid');
  grid.innerHTML = '';
  for (const p of photos) {
    const fig = document.createElement('figure');
    fig.innerHTML = `<img loading="lazy" alt="">${p.pinned ? '<span class="pin">📌</span>' : ''}`;
    fig.querySelector('img').src = withToken('files/thumb/' + p.file);
    fig.onclick = () => openViewer(p);
    grid.appendChild(fig);
  }
  $('empty').hidden = photos.length > 0;
  const s = await api('api/stats');
  $('stats').textContent = `${s.count} 张 · 占用 ${fmtBytes(s.bytes)}`;
}

$('tabs').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  for (const x of $('tabs').children) x.classList.toggle('on', x === b);
  kind = b.dataset.kind;
  refresh();
};

$('add').onclick = () => $('picker').click();
$('picker').onchange = () => {
  pending = [...$('picker').files];
  if (!pending.length) return;
  $('previews').innerHTML = '';
  for (const f of pending) {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    $('previews').appendChild(img);
  }
  if (kind) $('upKind').value = kind;
  $('upCaption').value = '';
  $('uploader').showModal();
};
$('upCancel').onclick = () => { $('uploader').close(); $('picker').value = ''; };
$('upGo').onclick = async () => {
  const btn = $('upGo');
  btn.disabled = true;
  try {
    for (let i = 0; i < pending.length; i++) {
      btn.textContent = `放进去 ${i + 1}/${pending.length}`;
      const fd = new FormData();
      fd.append('photo', pending[i]);
      fd.append('kind', $('upKind').value);
      fd.append('by', $('upBy').value);
      fd.append('caption', $('upCaption').value);
      await api('api/photos', { method: 'POST', body: fd });
    }
    $('uploader').close();
    $('picker').value = '';
    refresh();
  } catch (e) { alert(e.message); }
  btn.disabled = false; btn.textContent = '放进去';
};

function openViewer(p) {
  current = p;
  $('vImg').src = withToken('files/full/' + p.file);
  $('vMeta').textContent = `${KIND_NAME[p.kind]} · ${BY_NAME[p.by]}放的 · ${fmtDate(p.createdAt)}`;
  $('vCaption').value = p.caption;
  $('vPin').textContent = p.pinned ? '取消置顶' : '置顶';
  $('viewer').showModal();
}
async function patch(body) {
  const json = JSON.stringify(body);
  current = await api('api/photos/' + current.id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: json });
}
$('vClose').onclick = () => $('viewer').close();
$('vSave').onclick = async () => { await patch({ caption: $('vCaption').value }); $('viewer').close(); refresh(); };
$('vPin').onclick = async () => { await patch({ pinned: !current.pinned }); $('viewer').close(); refresh(); };
$('vDel').onclick = async () => {
  if (!confirm('真的删掉这张吗？删了就找不回来了')) return;
  await api('api/photos/' + current.id, { method: 'DELETE' });
  $('viewer').close(); refresh();
};

refresh().catch((e) => { $('empty').hidden = false; $('empty').textContent = e.message; });
</script>
</body>
</html>
